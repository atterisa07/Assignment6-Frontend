<h1>Task 1 - Selectors & CSS</h1>

<p id="first">Text by ID</p>
<p class="second">Text by Class</p>
<h3>Text by Tag</h3>

<button id="change">Change</button>

<script src="https://code.jquery.com/jquery-3.7.1.min.js"></script>

<script>
$(document).ready(function() {

    $("#change").click(function() {
        $("#first").text("Changed with ID");
        $(".second").html("<b>Changed with Class</b>");
        $("h3").css("color", "red");
    });

});
</script>
