<h1>Task 6 - Attributes</h1>

<img id="photo"
     src="https://picsum.photos/id/10/300/200"
     alt="Photo">

<br>

<button id="changeImage">Change Image</button>

<br><br>

<a id="link" href="https://google.com">Open website</a>

<br>

<button id="changeLink">Change Link</button>

<script src="https://code.jquery.com/jquery-3.7.1.min.js"></script>

<script>
$("#changeImage").click(function() {
    $("#photo").attr("src", "https://picsum.photos/id/20/300/200");
});

$("#changeLink").click(function() {
    $("#link").attr("href", "https://youtube.com");
    $("#link").text("Open YouTube");
});
</script>
